    document.documentElement.classList.remove('no-js');
    document.documentElement.classList.add('has-js');

  <!-- Google Fonts -->

  <!-- Main Stylesheet -->

</head>
<body>
  <!-- Accessible Skip Link -->
  <a href="#main" class="skip-link">Skip to content</a>

  <!-- Top Scroll Progress Line -->
  <div id="scroll-progress" aria-hidden="true"></div>

  <!-- Ambient Living Glow Container -->
  <div id="ambient-container" aria-hidden="true"></div>

  <!-- Static Grain Overlay -->
  <div class="grain-overlay" aria-hidden="true"></div>

<!-- START: INTRO_HTML -->
  <div id="intro" class="intro-overlay" role="dialog" aria-modal="true" aria-label="Introduction">
    <button type="button" class="intro-skip-btn" id="intro-skip-btn" aria-label="Skip introduction">
      Skip <span aria-hidden="true">→</span>
    </button>
    <div class="intro-center-stage">
      <div class="intro-svg-wrap" id="intro-svg-wrap">
        <!-- SVG signature or fallback text will be rendered here -->
      </div>
      <span class="intro-glint" id="intro-glint" aria-hidden="true">✦</span>
    </div>
  </div>
<!-- END: INTRO_HTML -->
  <!-- Fullscreen Mobile Menu Dialog -->
  <div id="mobile-menu-dialog" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Navigation Menu">
    <div class="mobile-menu-header">
      <span class="nav-logo">Shivam <span class="nav-logo-star">✦</span></span>
      <button type="button" class="mobile-menu-close" id="mobile-menu-close" aria-label="Close mobile menu">
        ✕
      </button>
    </div>

    <nav class="mobile-menu-links">

      <a href="#skills" class="mobile-menu-link">Skills</a>

      <a href="#" class="btn btn-primary" data-contact="whatsapp" style="width: 100%;">Let's talk on WhatsApp</a>
    </div>
  </div>

  <main id="main">
    <!-- Hero Section -->
    <section id="hero">
     <!-- START: HERO_HTML -->
      <div class="hero-stage container">
        <div class="hero-label-wrap">
          <span class="section-label">Web developer</span>
        </div>

        <h1 class="hero-title" id="hero-title" aria-label="I build websites that bring customers through the door.">
          <span class="hero-line">
            <span class="word-wrap"><span class="word-inner">I</span></span>
            <span class="word-wrap"><span class="word-inner">build</span></span>
            <span class="word-wrap"><span class="word-inner">websites</span></span>
            <span class="word-wrap"><span class="word-inner">that</span></span>
          </span>
          <span class="hero-line">
            <span class="word-wrap"><span class="word-inner">bring</span></span>
            <span class="hero-highlight italic-accent">
              <span class="word-wrap"><span class="word-inner">customers</span></span>
              <svg class="hero-underline-svg" viewBox="0 0 240 16" fill="none" preserveAspectRatio="none" aria-hidden="true">
                <path id="hero-underline-path" d="M3 11C70 4 175 5 237 10" stroke="var(--champagne)" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="word-wrap"><span class="word-inner">through</span></span>
          </span>
          <span class="hero-line">
            <span class="word-wrap"><span class="word-inner">the</span></span>
            <span class="word-wrap"><span class="word-inner">door.</span></span>
          </span>
        </h1>

        <p class="hero-subtext" id="hero-subtext">
          Fast, animated websites, online stores and AI assistants for small businesses.
        </p>

        <div class="hero-actions" id="hero-actions">
          <a href="works.html" class="btn btn-primary">See my work</a>
          <a href="#" class="btn btn-secondary" data-contact="whatsapp">WhatsApp</a>
        </div>

        <div class="hero-scroll-cue" id="hero-scroll-cue" aria-hidden="true">
          <span class="hero-scroll-text">Scroll</span>
          <div class="hero-scroll-line-wrap">
            <span class="hero-scroll-line"></span>
          </div>
        </div>
      </div>
<!-- END: HERO_HTML -->
    </section>

    <!-- Velocity Marquee Section -->
    <section id="marquee">
      <!-- SLOT: MARQUEE -->
    </section>

    <!-- About Section (Sliding Sheet) -->

    <!-- Contact Section (Sliding Sheet) -->
    <section id="contact" class="section-sheet" data-scroll-section>

    <!-- SLOT: FOOTER_CONTENT -->
